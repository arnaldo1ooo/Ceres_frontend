<mat-toolbar color="primary" class="toolbar">
  <span class="title">Lista de Órdenes</span>
  <span class="spacer"></span>
  <button mat-raised-button color="accent" (click)="agregarOrden()">
    <mat-icon>add</mat-icon>
    Nueva orden
  </button>
</mat-toolbar>

<div class="container">
  <mat-progress-spinner *ngIf="loading" mode="indeterminate" diameter="50"></mat-progress-spinner>

  <div class="cards" *ngIf="!loading && ordenes.length > 0">
    <mat-card class="orden-card" *ngFor="let orden of ordenes">
      <mat-card-header>
        <mat-card-title>Orden {{ orden.numero }}</mat-card-title>
        <mat-card-subtitle>
          Estado: {{ orden.estado }}
        </mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <p>
          <strong>Fecha Emisión:</strong> {{ orden.fechaEmision | date:'shortDate' }}
        </p>
        <p *ngIf="orden.nombreApellidoOcasional">
          <strong>Cliente Ocasional:</strong> {{ orden.nombreApellidoOcasional }}
        </p>
        <p *ngIf="orden.observacion">
          <strong>Observación:</strong> {{ orden.observacion }}
        </p>
      </mat-card-content>

      <mat-card-actions>
        <button mat-icon-button color="primary" (click)="editarOrden(orden)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="eliminarOrden(orden)">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-card-actions>
    </mat-card>
  </div>

  <div class="no-data" *ngIf="!loading && ordenes.length === 0">
    <p>No hay órdenes disponibles.</p>
  </div>
</div>
