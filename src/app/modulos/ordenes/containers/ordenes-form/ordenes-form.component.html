<div class="ui-orden-form-container">

  <div class="ui-div-toolbar">
    <div class="ui-div-filtros-lista-merc">
      <mat-form-field appearance="outline" class="ui-filtro-buscar-producto">
        <mat-label>Buscar Productos</mat-label>
        <input matInput id="filtroBuscarProducto" type="text" [(ngModel)]="filtroBuscarProducto" (ngModelChange)="filtrarMercaderias()">
      </mat-form-field>

      <mat-form-field appearance="outline" class="ui-select-filtro-tipo">
        <mat-label>Categoria</mat-label>
        <mat-select [(ngModel)]="filtroIdCategoria" (ngModelChange)="filtrarMercaderias()" [compareWith]="compararOpcionesSelect">
          <mat-option [value]="-1">TODOS</mat-option>
          <mat-option *ngFor="let categoria of listaCategoriasMercaderia" value={{categoria._id}}>
            {{categoria.descripcion}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>



  <div class="main-content">
    <div class="ui-lista-mercaderias">
      <mat-list>

        <ng-container *ngFor="let mercaderia of listaMercaderiasFiltradas; let ultimo = last">

          <mat-list-item (click)="addItem(mercaderia)" class="ui-list-item">
            <div class="ui-item ">
              <img class="ui-item-imagen" [src]="mercaderia.imagen || 'assets/imagenes/no_photo.png'"
                alt="Imagen de {{ mercaderia.descripcion }}">

              <div class="ui-item-detalle">
                <span matListItemTitle>{{ mercaderia.descripcion }}</span>
                <span matListItemLine>Second line</span>
              </div>
            </div>
          </mat-list-item>

          <mat-divider *ngIf="!ultimo"></mat-divider>

        </ng-container>



        <mat-divider></mat-divider> <!-- Línea divisoria después de cada ítem-->

      </mat-list>
    </div>

    <div class="selected-items">
      <h2>Selected Items</h2>
      <mat-list>
        <mat-list-item *ngFor="let selectedItem of selectedItems">
          <h4 matLine>{{selectedItem.nombre}} - {{selectedItem.precio | currency}}</h4>
          <!-- Quantity adjustment -->
          <mat-form-field appearance="fill">
            <mat-label>Qty</mat-label>
            <input matInput type="number" [(ngModel)]="selectedItem.cantidad" min="1">
          </mat-form-field>
          <button mat-button (click)="removeItem(selectedItem)">Remove</button>
        </mat-list-item>
      </mat-list>
      <div class="totals">
        <h4>Subtotal: {{getSubtotal() | currency}}</h4>
        <h4>Tax (15%): {{getTax() | currency}}</h4>
        <h4>Total: {{getTotal() | currency}}</h4>
      </div>
      <button mat-raised-button color="accent" (click)="checkout()">Checkout</button>
    </div>
  </div>
</div>
