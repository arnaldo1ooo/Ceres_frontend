<div class="style-container" [class.style-is-mobile]="mobileQuery.matches" *ngIf="shouldRun">
  <mat-toolbar color="primary" class="style-toolbar" *ngIf="isSesionIniciada$ | async">
    <!--Si se inició sesion muestra rl boton para abrir barra lateral-->
    <button mat-icon-button (click)="abrirOCerrar()"><mat-icon>menu</mat-icon></button>
    <span class="style-app-nombre">Sistema Ceres</span>
    <span class="style-expandir"></span> <!--Expande el espacio para que los elementos siguientes queden al final-->

    <button mat-icon-button (click)="alternarTema()"
      matTooltip="{{ temaOscuro ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro' }}" aria-label="Cambiar tema">
      <mat-icon>{{ !temaOscuro ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>

    <button mat-button (click)="cerrarSesion()">Desconectar</button>
  </mat-toolbar>

  <mat-sidenav-container class="style-sidenav-container" [style.marginTop.px]="mobileQuery.matches ? 56 : 0">
    <mat-sidenav #elSideNav [mode]="mobileQuery.matches ? 'over' : 'side'" [fixedInViewport]="mobileQuery.matches"
      fixedTopGap="56" [opened]="isAbierto" *ngIf="isSesionIniciada$ | async">
      <mat-nav-list *ngIf="isSesionIniciada$ | async">
  
        <ng-container *ngFor="let menu of menus">
          <a mat-list-item [routerLink]="menu.ruta" *ngIf="menu.nombre === 'Home'">
            <mat-icon class="style-icono">{{ menu.icono }}</mat-icon>
            {{ menu.nombre }}
          </a>

          <a mat-list-item [routerLink]="menu.ruta" *ngIf="menu.nombre === 'Departamentos'">
            <mat-icon class="style-icono">{{ menu.icono }}</mat-icon>
            {{ menu.nombre }}
          </a>

          <a mat-list-item [routerLink]="menu.ruta" *ngIf="menu.nombre === 'Entidades'">
            <mat-icon class="style-icono">{{ menu.icono }}</mat-icon>
            {{ menu.nombre }}
          </a>

          <a mat-list-item [routerLink]="menu.ruta" *ngIf="menu.nombre === 'Mercaderias'">
            <mat-icon class="style-icono">{{ menu.icono }}</mat-icon>
            {{ menu.nombre }}
          </a>

          <a mat-list-item [routerLink]="menu.ruta" *ngIf="menu.nombre === 'Movimientos'">
            <mat-icon class="style-icono">{{ menu.icono }}</mat-icon>
            {{ menu.nombre }}
          </a>
        </ng-container>

      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <router-outlet></router-outlet>
    </mat-sidenav-content>

  </mat-sidenav-container>

  <div>
    <app-footer-principal></app-footer-principal>
  </div>

</div>
